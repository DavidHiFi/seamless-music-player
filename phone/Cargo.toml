[package]
name = "music-search-phone"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The phone page for Music Search: search Soulseek and YouTube, tap Add, it lands in the library."
publish = false

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json = "1"
md-5 = "0.10"
regex = "1"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
